version: '3.8'

services:
  backend:
    image: servai/backend:latest
    restart: always
    environment:
      - DEBUG=False
      - NODE_ENV=production
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - servai-network

  frontend:
    image: servai/frontend:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - servai-network

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/servai.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    networks:
      - servai-network
    depends_on:
      - backend
      - frontend

  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-servai}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - servai-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - servai-network

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    networks:
      - servai-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

networks:
  servai-network:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
